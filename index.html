<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toss Master | Official Telegram Channel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #14233c 0%, #070d17 100%);
      color: #ffffff;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 136, 204, 0.2);
      border: 1px solid #0088cc;
      color: #29b6f6;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 50px;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .coin-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      color: #3b2000;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    /* Circular Countdown Timer */
    .timer-container {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 24px;
    }

    .timer-svg {
      transform: rotate(-90deg);
      width: 110px;
      height: 110px;
    }

    .timer-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 6;
    }

    .timer-progress {
      fill: none;
      stroke: #0088cc;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 283;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }

    .timer-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
    }

    .timer-text #countdown {
      display: block;
    }

    .timer-text .timer-label {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: #64748b;
      margin-top: -2px;
    }

    /* Big Center CTA Button */
    .cta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 18px 24px;
      background: linear-gradient(135deg, #0088cc, #00b4d8);
      color: #ffffff;
      text-decoration: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.3px;
      box-shadow: 0 10px 25px rgba(0, 136, 204, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      animation: pulse 2s infinite;
    }

    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 136, 204, 0.6);
    }

    .cta-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(0, 136, 204, 0.6);
      }
      70% {
        box-shadow: 0 0 0 16px rgba(0, 136, 204, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(0, 136, 204, 0);
      }
    }

    .notice {
      margin-top: 18px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Official Verified Channel</div>
    
    <div class="coin-icon">🪙</div>
    
    <h1>Toss Master</h1>
    <p>Exclusive predictions, match updates, and daily winning analysis directly on Telegram.</p>

    <!-- 15-Second Timer -->
    <div class="timer-container">
      <svg class="timer-svg" viewBox="0 0 100 100">
        <circle class="timer-bg" cx="50" cy="50" r="45"></circle>
        <circle class="timer-progress" id="progress" cx="50" cy="50" r="45"></circle>
      </svg>
      <div class="timer-text">
        <span id="countdown">15</span>
        <span class="timer-label">SEC</span>
      </div>
    </div>

    <!-- Telegram Button -->
    <a href="https://t.me/+xElckt3vs7ozOGI1" id="joinBtn" class="cta-btn">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
      </svg>
      JOIN NOW TELEGRAM
    </a>

    <div class="notice">
      Redirecting automatically in a few seconds...
    </div>
  </div>

  <script>
    const targetUrl = "https://t.me/+xElckt3vs7ozOGI1";
    let timeLeft = 15;
    const totalTime = 15;
    const circumference = 2 * Math.PI * 45; // ~283

    const countdownEl = document.getElementById("countdown");
    const progressEl = document.getElementById("progress");

    progressEl.style.strokeDasharray = circumference;

    const timer = setInterval(() => {
      timeLeft--;
      countdownEl.innerText = timeLeft;

      const offset = circumference - (timeLeft / totalTime) * circumference;
      progressEl.style.strokeDashoffset = offset;

      if (timeLeft <= 0) {
        clearInterval(timer);
        window.location.href = targetUrl;
      }
    }, 1000);
  </script>

</body>
</html>
